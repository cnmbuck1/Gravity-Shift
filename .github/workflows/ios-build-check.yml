# Compiles the iPhone app (for the simulator, unsigned) on pull requests that touch native code,
# so a Swift mistake shows up on the PR instead of in a TestFlight upload. Uploads nothing.
name: iOS build check
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'ios/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.ts'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ios:sync
      - name: Build for the simulator
        run: |
          xcodebuild build \
            -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

# Creates Gravitor's Game Center leaderboards, sets and achievements in App Store Connect from
# tools/gamecenter/catalog.json. Run it by hand: GitHub → Actions → "Set up Game Center" → Run workflow.
# Leave "apply" unticked for a dry run that only lists what it would create. Safe to run again:
# anything that already exists is skipped. Uses the same App Store Connect API key secrets as
# "Upload to TestFlight" (ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8).
name: Set up Game Center
on:
  workflow_dispatch:
    inputs:
      task:
        description: setup = create items; review-probe = read-only API check; review-add = add items to the draft review submission
        type: choice
        options: [setup, review-probe, review-add]
        default: setup
      apply:
        description: Do it for real (unticked = dry run, nothing changes)
        type: boolean
        default: false
      extra:
        description: Extra arguments for review-add (e.g. --waiting --limit 1)
        type: string
        default: ''
permissions:
  contents: read
jobs:
  gamecenter:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Write the App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"
      - name: Create leaderboards and achievements
        if: inputs.task == 'setup' || inputs.task == ''
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLY: ${{ inputs.apply && '--apply' || '' }}
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyjwt cryptography
          "$RUNNER_TEMP/venv/bin/python" -u tools/gamecenter/setup.py "$RUNNER_TEMP/keys/AuthKey.p8" "$KEY_ID" "$ISSUER_ID" $APPLY
      - name: Add to App Review submission
        if: inputs.task == 'review-probe' || inputs.task == 'review-add'
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          MODE: ${{ inputs.task == 'review-probe' && 'probe' || 'add' }}
          EXTRA: ${{ inputs.extra }}
          APPLY: ${{ inputs.apply && '--apply' || '' }}
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyjwt cryptography
          "$RUNNER_TEMP/venv/bin/python" -u tools/gamecenter/submit.py "$RUNNER_TEMP/keys/AuthKey.p8" "$KEY_ID" "$ISSUER_ID" "$MODE" $APPLY $EXTRA
      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"

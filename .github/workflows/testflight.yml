# Builds the iPhone app and uploads it to TestFlight. Run it by hand:
# GitHub → Actions → "Upload to TestFlight" → Run workflow.
#
# Needs these repository secrets (Settings → Secrets and variables → Actions); see docs/TESTFLIGHT.md:
#   APPLE_TEAM_ID                 10-character Team ID from developer.apple.com → Membership
#   ASC_KEY_ID                    App Store Connect API key ID
#   ASC_ISSUER_ID                 App Store Connect API issuer ID
#   ASC_KEY_P8                    Contents of the AuthKey_XXXX.p8 file (Admin role, for cloud signing)
# Optional (see docs/FIREBASE.md):
#   GOOGLE_SERVICE_INFO_PLIST     Contents of GoogleService-Info.plist from the Gravitor Firebase project.
#                                 Without it the build still works, just without analytics.
name: Upload to TestFlight
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Build number (leave empty to use 100 + the workflow run number)
        required: false
      runner:
        description: Mac to build on. If a run sits queued and is cancelled after 15 minutes, GitHub is short of that Mac; pick another.
        type: choice
        default: macos-26
        options:
          - macos-26
          - macos-15
          - macos-15-intel
      app_store:
        description: App Store build (hides the testing options such as Unlock all levels and Physics). Untick for a tester build.
        type: boolean
        default: true
concurrency:
  group: testflight
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  testflight:
    runs-on: ${{ inputs.runner || 'macos-26' }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Check Xcode is new enough for the App Store
        run: |
          xcodebuild -version
          major=$(xcodebuild -version | awk 'NR==1 {split($2, v, "."); print v[1]}')
          if [ "$major" -lt 26 ]; then
            echo "::error::App Store uploads need Xcode 26 or later, but this Mac has Xcode $major. Run again on macos-26."
            exit 1
          fi
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build the game and copy it into the Xcode project
        env:
          GRAVITOR_RELEASE: ${{ inputs.app_store == false && '0' || '1' }}
        run: npm run ios:sync
      - name: Add the Firebase config (analytics)
        env:
          GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
        run: |
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "::warning::No GOOGLE_SERVICE_INFO_PLIST secret, so this build has no Firebase Analytics. See docs/FIREBASE.md."
            exit 0
          fi
          printf '%s\n' "$GOOGLE_SERVICE_INFO_PLIST" > ios/App/App/GoogleService-Info.plist
          plutil -lint ios/App/App/GoogleService-Info.plist
          # Firebase registers bundle IDs in lowercase, but this app's is "Com..." (capital C, as in
          # App Store Connect). Same app, different case: accept it and write the app's exact ID into
          # the plist so Firebase doesn't log a bundle ID mismatch at launch.
          app_id="Com.cnmbuckstudios.gravitor"
          bundle=$(plutil -extract BUNDLE_ID raw ios/App/App/GoogleService-Info.plist)
          if [ "$(printf '%s' "$bundle" | tr 'A-Z' 'a-z')" != "$(printf '%s' "$app_id" | tr 'A-Z' 'a-z')" ]; then
            echo "::error::GoogleService-Info.plist is for bundle ID '$bundle', but the app is $app_id. Register the iOS app in Firebase with that bundle ID and download the plist again."
            exit 1
          fi
          plutil -replace BUNDLE_ID -string "$app_id" ios/App/App/GoogleService-Info.plist
          echo "Firebase config added (project $(plutil -extract PROJECT_ID raw ios/App/App/GoogleService-Info.plist))"
      - name: Write the App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"
      - name: Revoke development certificates left by earlier runs
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --quiet pyjwt cryptography
          "$RUNNER_TEMP/venv/bin/python" tools/ci/revoke_ci_dev_certs.py "$RUNNER_TEMP/keys/AuthKey.p8" "$KEY_ID" "$ISSUER_ID"
      - name: Archive
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          BUILD="${BUILD_NUMBER:-$((100 + GITHUB_RUN_NUMBER))}"
          echo "Build number $BUILD"
          xcodebuild archive \
            -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Gravitor.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            CURRENT_PROJECT_VERSION="$BUILD"
      - name: Upload to App Store Connect
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          sed "s/TEAM_ID_PLACEHOLDER/$TEAM_ID/" ios/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Gravitor.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID"
      - name: Show why the upload failed
        if: failure()
        run: |
          # Xcode writes the real reason for export/upload errors to a logs bundle, not to the console.
          for d in $(find "${TMPDIR:-/tmp}" "$RUNNER_TEMP" -name '*.xcdistributionlogs' -maxdepth 3 2>/dev/null); do
            for f in "$d"/IDEDistribution*.log; do
              [ -f "$f" ] || continue
              echo "::group::$(basename "$f")"
              grep -iE 'error|fail|status|code|agreement|forbidden|not found|denied|NSLocalized' "$f" | tail -n 80 || true
              echo "::endgroup::"
            done
            cp -R "$d" "$RUNNER_TEMP/distribution-logs" 2>/dev/null || true
          done
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: distribution-logs
          path: ${{ runner.temp }}/distribution-logs
          if-no-files-found: ignore
      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
